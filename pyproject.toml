[project]
name = "daiist-assignment1"
version = "0.1.0"
description = "Assignment 1: linear/logistic regression trained three ways, served with Gradio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "torch>=2.4,<2.12",
    "gradio>=5.0,<7.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pytest>=8.0",
    "polars>=1.44.2",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "pyarrow>=25.0.1",
    "statsmodels>=0.15.0",
    "xlrd>=2.0.2",
    "dcor>=0.7",
    "holidays>=0.105",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "optuna>=5.0.0",
    "kaleido>=1.5.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
