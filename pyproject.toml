[project]
name = "daiist-assignment1"
version = "0.1.0"
description = "Assignment 1: linear/logistic regression trained three ways, served with Gradio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "torch>=2.4,<2.12",
    "gradio>=5.0,<7.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "kagglehub>=1.0.2",
]
